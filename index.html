<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ذاكرة — نظام ترسيخ المعلومات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <!-- ── Navigation ─────────────────────────────────────────── -->
  <nav class="navbar">
    <div class="nav-brand" onclick="App.navigate('dashboard')">
      <span class="brand-icon">🧠</span>
      <span class="brand-name">ذاكرة</span>
    </div>

    <div class="nav-links">
      <button class="nav-btn active" data-view="dashboard" onclick="App.navigate('dashboard')">الرئيسية</button>
      <button class="nav-btn" data-view="library" onclick="App.navigate('library')">المكتبة</button>
      <button class="nav-btn" data-view="quiz" onclick="App.navigate('quiz')">الاختبار</button>
      <button class="nav-btn" data-view="review" onclick="App.navigate('review')">المراجعة</button>
      <button class="nav-btn" data-view="stats" onclick="App.navigate('stats')">الإحصائيات</button>
    </div>

    <div class="nav-user">
      <div class="nav-xp-wrap">
        <span id="nav-xp" class="nav-xp-val">0 XP</span>
        <div class="nav-xp-bar"><div id="nav-progress" class="nav-xp-fill"></div></div>
      </div>
      <div id="nav-level" class="nav-level-badge">المستوى 1</div>
      <div class="nav-streak">
        <span class="streak-flame">🔥</span>
        <span id="nav-streak">0</span>
      </div>
    </div>

    <button class="hamburger" id="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
  </nav>

  <!-- ── Main Content ────────────────────────────────────────── -->
  <main id="app-main" class="app-main">
    <div class="loading-screen">
      <div class="loading-brain">🧠</div>
      <p>جارٍ التحميل...</p>
    </div>
  </main>

  <!-- ── Quiz Modal ──────────────────────────────────────────── -->
  <div class="modal-overlay" id="quiz-modal" style="display:none">
    <div class="modal-container">
      <div id="quiz-content"></div>
    </div>
  </div>

  <!-- ── Toast ──────────────────────────────────────────────── -->
  <div id="toast" class="toast"></div>

  <!-- ── XP Popup ───────────────────────────────────────────── -->
  <div id="xp-popup" class="xp-popup"></div>

  <!-- ── Scripts ────────────────────────────────────────────── -->
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
